name: Security audit

on:
  schedule:
    # Mondays 00:00 UTC
    - cron: "0 0 * * 1"
  workflow_dispatch:
  push:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.cargo/audit.toml'
      - '.github/workflows/audit.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

jobs:
  frontend:
    name: pnpm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false
      - name: Audit production dependencies
        run: pnpm audit --prod --registry=https://registry.npmjs.org
      # braces has no patched release; retain the development-tooling report.
      - name: Audit all dependencies including development tools
        continue-on-error: true
        run: pnpm audit --registry=https://registry.npmjs.org

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        path:
          - src-tauri
          - cli

    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit Rust dependencies
        run: cargo audit --file ${{ matrix.path }}/Cargo.lock
